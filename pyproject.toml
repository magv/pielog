[project]
name = "pielog"
description = "Hierarchical logging & execution tracing"
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: System :: Logging"
]
authors = [{name = "Vitaly Magerya"}]

dynamic = ["version"]

[project.optional-dependencies]
testing = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["cython>=3.1", "setuptools>=83", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "pielog/_version.h"
version_file_template = "/* This file is autogenerated during build. */\n#define PIELOG_VERSION \"{version}\"\n"

[tool.setuptools]
py-modules = []
packages = ["pielog-stubs"]

[tool.setuptools.package-data]
"pielog-stubs" = ["__init__.pyi"]

# Install the C headers as pielog/ in the install tree (for
# #include <pielog/pielog.h> consumers), and the stub for the
# top-level `pielog` extension module as
# `pielog.pyi` right next to `pielog.abi3.so` (the "/" directory is the
# root of the install tree, which for a wheel is site-packages itself).
# Note: pielog/ must not be a setuptools package -- it holds no Python
# code, and a package mapping would shadow the extension module for
# editable installs (breaking runtime-introspection tools like jedi).
[tool.setuptools.data-files]
"/" = ["pielog.pxd"]
"/pielog" = ["pielog/bprint.h", "pielog/pielog.cpp", "pielog/pielog.h",
            "pielog/utils.h"]

[[tool.setuptools.ext-modules]]
name = "pielog"
sources = ["pielog.pyx"]
depends = [
    "pielog/bprint.h",
    "pielog/pielog.cpp",
    "pielog/pielog.h",
    "pielog/utils.h",
]
include-dirs = ["pielog"]
extra-compile-args = [
    "-std=c++17",
    "-Wno-unused-function",
    "-DPy_LIMITED_API=0x030A0000",
    "-UNDEBUG",
    "-pthread",
]
extra-link-args = [
    "-pthread",
    "-s",
]
py-limited-api = true

[tool.distutils.bdist_wheel]
py-limited-api = "cp310"
