[project]
name = "pielog"
description = "Hierarchical logging & execution tracing"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: System :: Logging"
]
authors = [{name = "Vitaly Magerya"}]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/magv/pielog"

[project.optional-dependencies]
testing = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["cython>=3.1", "setuptools>=83", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "pielog/_version.h"
version_file_template = """\
/* This file is autogenerated during build. */
#define PIELOG_VERSION \"{version}\"
"""

[tool.setuptools]
py-modules = []
packages = ["pielog-stubs"]

[tool.setuptools.package-data]
"pielog-stubs" = ["__init__.pyi"]

[tool.setuptools.data-files]
"/" = ["pielog.pxd"]
"/pielog" = [
    "pielog/bprint.h",
    "pielog/pielog.cpp",
    "pielog/pielog.h",
    "pielog/utils.h"
]

[[tool.setuptools.ext-modules]]
name = "pielog"
sources = ["pielog.pyx"]
depends = [
    "pielog/bprint.h",
    "pielog/pielog.cpp",
    "pielog/pielog.h",
    "pielog/utils.h",
]
include-dirs = ["pielog"]
extra-compile-args = [
    "-std=c++17",
    "-Wno-unused-function",
    "-DPy_LIMITED_API=0x030A0000",
    "-UNDEBUG",
    "-pthread",
]
extra-link-args = [
    "-pthread",
    "-s",
]
py-limited-api = true

[tool.distutils.bdist_wheel]
py-limited-api = "cp310"
